<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <title>PolyTail · 多币种尾盘策略</title>
  <link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
  <script src="/static/app.js?v=__ASSET_VERSION__" defer></script>
</head>
<body data-page="dashboard">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark">P</span><span>PolyTail <small>多币种尾盘</small></span></div>
      {{NAV}}
      <div class="topbar-right">
        <span id="conn" class="badge gray">稳定</span>
        <span id="clock" class="mono small muted"></span>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="page-head">
      <div>
        <h1>多币种尾盘总览</h1>
        <p>7 个币 × 15m / 5m，共 14 个策略；已启用的计入上方统计，未启用的可直接去「参数」页开启</p>
      </div>
      <div class="btn-row">
        <button class="btn small danger" id="stop-all">全部停止新开仓</button>
        <button class="btn small" id="release-all">全部恢复</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">合计交易</div><div class="v" id="ov-trades">--</div><div class="s">已启用策略合计</div></div>
      <div class="stat"><div class="k">合计净收益</div><div class="v" id="ov-pnl">--</div><div class="s">已扣官方费用</div></div>
      <div class="stat"><div class="k">合计 ROI</div><div class="v" id="ov-roi">--</div><div class="s">按投入本金</div></div>
      <div class="stat"><div class="k">持仓 / 胜率</div><div class="v" id="ov-open">--</div><div class="s">胜率 <span id="ov-winrate">--</span></div></div>
    </div>

    <div class="grid strategy-grid" id="strategy-grid" style="margin-top:16px">
      <div class="card"><div class="muted small">等待状态…</div></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <div class="card-title">最近信号（已启用策略合并）</div>
        <a href="/trades" class="small">交易记录 →</a>
      </div>
      <div class="table-wrap" id="signals-all"></div>
    </div>

  </div>
</body>
</html>
