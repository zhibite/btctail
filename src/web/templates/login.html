<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <title>登录 · PolyTail</title>
  <link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
  <script src="/static/app.js?v=__ASSET_VERSION__" defer></script>
</head>
<body data-page="login">
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="brand-mark">P</span><span>PolyTail <small>多币种尾盘</small></span></div>
      <h1>登录</h1>
      <div id="login-config-warning" class="hidden"></div>
      <div id="login-error" class="hidden"></div>
      <form id="login-form">
        <label class="field" style="margin-bottom:12px">
          <span class="label">用户名</span>
          <input type="text" id="username" value="admin" autocomplete="username" autofocus>
        </label>
        <label class="field" style="margin-bottom:18px">
          <span class="label">密码</span>
          <input type="password" id="password" autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary" style="width:100%">登录</button>
      </form>
    </div>
  </div>
</body>
</html>
