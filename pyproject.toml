[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytail-btc15"
version = "0.1.0"
description = "Polymarket BTC tail-favorite strategies: frozen 15m + agent-tuned 5m, run concurrently"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "py-clob-client-v2>=1.0,<2",
    "eth-account>=0.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # research / backtest
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
agent = [
    "anthropic>=0.40",
]
redeem = [
    "web3>=6.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
