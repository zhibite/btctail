###############################################################################
# PolyTail BTC 15m — 非敏感运行配置
#
# 优先级（低 → 高）：
#   代码默认值 < config.toml < .env.docker < .env < 进程环境变量
#          < 网页「参数」页的运行时覆盖（存数据库，重启保留）
#
# 敏感信息（API Key / 私钥 / 网页密码）只放 .env 或部署平台环境变量。
###############################################################################

[GENERAL]
# 基础标的 / 命令行默认周期。程序固定创建 7 个币 × 15m / 5m 共 14 个策略，
# 哪些启用、纸面/实盘、窗口/阈值等都按策略保存在数据库，并在网页「参数」页配置。
# 默认只启用 BTC 15m / 5m；窗口按 UTC 对齐（15m = 900 秒，5m = 300 秒）。
ASSET = "BTC"
PERIOD = "15m"
# 可选：一次指定启用的策略，覆盖 BTC 默认开关，例如
# ENABLED_STRATEGIES = "BTC:15m,BTC:5m,ETH:15m,ETH:5m"

[LOG]
# DEBUG / INFO / WARNING / ERROR
LEVEL = "INFO"
# 心跳日志间隔（秒）
HEARTBEAT_S = 30
