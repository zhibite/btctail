###############################################################################
# PolyTail BTC 15m — 非敏感运行配置
#
# 优先级（低 → 高）：
#   代码默认值 < config.toml < .env.docker < .env < 进程环境变量
#          < 网页「参数」页的运行时覆盖（存数据库，重启保留）
#
# 敏感信息（API Key / 私钥 / 网页密码）只放 .env 或部署平台环境变量。
###############################################################################

[GENERAL]
# 交易标的。窗口按 UTC 对齐（15m = 900 秒，5m = 300 秒）。
# 实际运行哪些周期由 ENABLED_15M / ENABLED_5M 决定；
# PERIOD 只是命令行工具的默认 --period。
ASSET = "BTC"
PERIOD = "15m"

[LOG]
# DEBUG / INFO / WARNING / ERROR
LEVEL = "INFO"
# 心跳日志间隔（秒）
HEARTBEAT_S = 30
